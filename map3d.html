<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<title>3D Map · Trail Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* 3D view of the trail finder: satellite imagery on real terrain (no API key), with the same trail data
   and difficulty colours as index.html. Kept as its own page so it doesn't touch the main app's code. */
:root {
  --bg: #f3f5f2; --panel: #ffffff; --fg: #1d2420; --muted: #5c6862; --line: #d9dfda; --chip: #e8ece8;
  --accent: #1f6f4a; --accent-fg: #ffffff; --warn-bg: #fff4d6; --warn-fg: #6b4a00;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --panel: #1a201c; --fg: #e6ebe7; --muted: #9aa69f; --line: #2c3530; --chip: #252d28;
    --accent: #5cc98f; --accent-fg: #0d1a12; --warn-bg: #3a2f12; --warn-fg: #ffd98a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --panel: #1a201c; --fg: #e6ebe7; --muted: #9aa69f; --line: #2c3530; --chip: #252d28;
  --accent: #5cc98f; --accent-fg: #0d1a12; --warn-bg: #3a2f12; --warn-fg: #ffd98a; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font-family: var(--font-display); font-size: 1.5rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
h1 span { color: var(--accent); }
a.back { color: var(--accent); font-weight: 600; text-decoration: none; padding: 4px 0; }
.wrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; background: #9fb3c8; }

.panel { position: absolute; top: 10px; left: 10px; z-index: 2; width: 270px; max-width: calc(100% - 70px); max-height: calc(100% - 50px); overflow: auto;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.25); padding: 10px 12px; }
.panel h2 { font-family: var(--font-display); font-size: 1.05rem; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.panel .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel .body { margin-top: 8px; display: grid; gap: 10px; }
.panel.closed .body { display: none; }
.lbl { font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
select, input[type=range] { width: 100%; }
select { font: inherit; padding: 5px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button, .toggle { font: inherit; font-size: .88rem; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.checks label { display: flex; align-items: center; gap: 6px; font-size: .92rem; cursor: pointer; }
.linkish { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; }
.key { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: .85rem; }
.sw { width: 26px; height: 5px; border-radius: 3px; }
.sw.dbl { background: #d6202a; }
.sw.new { height: 7px; box-shadow: 0 0 0 2px #fff; background: #1c6fe0; }
.status { font-size: .85rem; color: var(--muted); }
.status.warn { color: var(--warn-fg); background: var(--warn-bg); border-radius: 6px; padding: 4px 6px; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }

.maplibregl-popup-content { background: var(--panel); color: var(--fg); font-family: var(--font-body); border-radius: 8px; padding: 10px 12px; max-width: 260px; }
.maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
.maplibregl-popup-close-button { color: var(--muted); font-size: 18px; }
.pop h3 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 16px 4px 0; line-height: 1.1; }
.pop p { margin: 2px 0; font-size: .88rem; }
.pop a { color: var(--accent); font-weight: 600; }
.diff { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #fff; }
.tag { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--chip); }
@media (max-width: 600px) { .panel { width: auto; right: 60px; } }
</style>
</head>
<body>
<header class="top">
  <h1>Trail <span>3D</span></h1>
  <a class="back" href="./">← Trail finder</a>
</header>
<div class="wrap">
  <div id="map" role="region" aria-label="3D map of trails"></div>
  <section class="panel" id="panel">
    <div class="head">
      <h2>3D trails</h2>
      <button class="linkish" id="fold" type="button" aria-expanded="true">Hide</button>
    </div>
    <div class="body">
      <div>
        <div class="lbl">Go to</div>
        <select id="zone"></select>
      </div>
      <div>
        <div class="lbl">New trails mapped in the last</div>
        <div class="seg" id="months">
          <button type="button" data-m="1">1 month</button><button type="button" data-m="6">6 months</button><button type="button" data-m="12">1 year</button><button type="button" data-m="24">2 years</button>
        </div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="showNew" checked> New trails (white edge)</label>
        <label><input type="checkbox" id="showAll" checked> All MTB trails</label>
        <label><input type="checkbox" id="showNames" checked> Trail names</label>
        <label><input type="checkbox" id="showPlaces" checked> Place names and roads</label>
      </div>
      <div>
        <div class="lbl">Mountain height <span id="exagVal"></span></div>
        <input type="range" id="exag" min="1" max="2.5" step="0.1" value="1.5" aria-label="Terrain exaggeration">
      </div>
      <div class="key" aria-label="Trail colours">
        <span class="sw" style="background:#2f9e44"></span><span>Green</span>
        <span class="sw" style="background:#1c6fe0"></span><span>Blue</span>
        <span class="sw" style="background:#1b1b1b"></span><span>Black</span>
        <span class="sw dbl"></span><span>Double black</span>
        <span class="sw" style="background:#e8590c"></span><span>Pro line</span>
        <span class="sw" style="background:#8a8f98"></span><span>Not rated yet</span>
        <span class="sw new"></span><span>New trail</span>
      </div>
      <div class="status" id="status" role="status">Loading trails…</div>
      <p class="hint">Drag to move, right-drag or two-finger drag to tilt and turn. Tap a trail for its details.</p>
    </div>
  </section>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  // Same "tf:" keys as index.html, so the period and area carry over between the two pages.
  const store = {
    get(k, d) { try { const v = localStorage.getItem("tf:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("tf:" + k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function setStatus(msg, warn) { const s = $("status"); s.textContent = msg; s.classList.toggle("warn", !!warn); }

  // Same zones as index.html (south, west, north, east).
  const ZONES = [
    { id: "van", name: "Vancouver & North Shore", box: [49.18, -123.30, 49.45, -122.75] },
    { id: "sqm", name: "Howe Sound & Squamish", box: [49.45, -123.32, 49.96, -122.95] },
    { id: "wh", name: "Whistler", box: [49.96, -123.20, 50.25, -122.85] },
    { id: "pem", name: "Pemberton", box: [50.25, -123.05, 50.42, -122.62] },
    { id: "lil", name: "Lillooet & Duffey", box: [50.42, -122.45, 50.80, -121.80] },
    { id: "sun", name: "Sunshine Coast (Gibsons to Egmont)", box: [49.38, -124.12, 49.80, -123.45] },
    { id: "pr", name: "Powell River & Lund", box: [49.75, -124.78, 50.06, -124.25] },
  ];
  const zoneBounds = (z) => [[z.box[1], z.box[0]], [z.box[3], z.box[2]]];   // [[w, s], [e, n]]

  // ---------- classification (a trimmed copy of index.html's) ----------
  const PAVED = /^(asphalt|paved|concrete|concrete:plates|concrete:lanes|paving_stones|sett|cobblestone|metal|chipseal)$/;
  const NATURAL = /^(dirt|earth|ground|mud|rock|roots|woodchips|soil)$/;
  const ROUGH = /^(bad|very_bad|horrible|very_horrible|impassable)$/;
  const BIKEY_NAME = /\b(flow|berm|berms|jump|jumps|enduro|downhill|dh|xc|singletrack|single ?trail|freeride|pump ?track|bike|vtt)\b/i;
  const BIKE_NOTE = /\b(mountain ?bik\w*|mtb|bike (trail|park|line|jumps?))\b/i;
  const NO_BIKE_NOTE = /\b(no|not|non|closed to)\b[\w -]{0,14}\b(bik|mtb|cycl)/i;
  const MOTO_OK = /^(yes|designated|permissive|permit)$/;
  const MOTO_NAME = /\b(atvs?|quads?|motocross|mx|dirt ?bikes?|motorbikes?|motorcycles?|orv|ohv|4x4|4wd|jeep)\b/i;
  const NOT_MOTO_NAME = /\b(no|non|not)[- ]?(motori[sz]ed|atvs?|quads?|motorbikes?|motorcycles?|dirt ?bikes?|vehicles?)\b/i;
  const isMtbKey = (tags) => (k) => /^mtb(:|$)/.test(k) && !(k === "mtb" && tags.mtb === "no");

  // Moto or hiking-only trails are hidden, like on the main map. Never applied to trails with MTB tags.
  function hiddenUse(tags, routeTypes) {
    const hw = tags.highway || "";
    if (Object.keys(tags).some(isMtbKey(tags)) || routeTypes.includes("mtb") || tags.bicycle === "designated") return false;
    if (tags["dirtbike:scale"] || tags.motorcycle === "designated" || tags["4wd_only"] === "yes") return true;
    if (hw === "path" && (MOTO_OK.test(tags.motorcycle || "") || MOTO_OK.test(tags.motor_vehicle || ""))) return true;
    if (["atv", "ohv", "orv"].some((k) => MOTO_OK.test(tags[k] || ""))) return true;
    if (/\b(motocross|quadcross|motor)\b/.test(tags.sport || "") || routeTypes.includes("atv")) return true;
    if (tags.name && MOTO_NAME.test(tags.name) && !NOT_MOTO_NAME.test(tags.name)) return true;
    if (/^(no|dismount)$/.test(tags.bicycle || "") || tags.mtb === "no") return true;
    return false;
  }
  // "mtb" (MTB tagged), "looks" (looks like MTB) or null.
  function category(tags, routeTypes) {
    if (tags.bicycle === "dismount") return null;
    if (Object.keys(tags).some(isMtbKey(tags)) || routeTypes.includes("mtb")) return "mtb";
    if (!/^(path|bridleway)$/.test(tags.highway) || PAVED.test(tags.surface || "") || /alpine/.test(tags.sac_scale || "")) return null;
    let score = 0;
    if (/^(designated|customers)$/.test(tags.bicycle || "")) score += 2;
    else if (/^(yes|permissive)$/.test(tags.bicycle || "")) score += 1;
    if (NATURAL.test(tags.surface || "")) score += 1;
    if (ROUGH.test(tags.smoothness || "")) score += 1;
    const w = parseFloat(tags.width || tags.est_width);
    if (!isNaN(w) && w < 1.5) score += 1;
    if (tags.trail_visibility || tags.incline) score += 1;
    if (tags.name && BIKEY_NAME.test(tags.name)) score += 1;
    if ([tags.description, tags.note].some((v) => v && BIKE_NOTE.test(v) && !NO_BIKE_NOTE.test(v))) score += 2;
    if (/trailforks/i.test([tags.source, tags.website, tags["website:trailforks"], tags.url].join(" "))) score += 1;
    const motor = !/^(designated|customers)$/.test(tags.bicycle || "") && ((!isNaN(w) && w >= 2) || ["motorcycle", "motor_vehicle", "atv", "ohv", "orv"].some((k) => MOTO_OK.test(tags[k] || "")));
    return score >= 2 && !motor ? "looks" : null;
  }
  const CAT_LABEL = { mtb: "MTB tagged", looks: "Looks like MTB" };

  // Difficulty as Trailforks colours it, same as index.html.
  const DIFF = {
    green: { label: "Green", color: "#2f9e44" }, blue: { label: "Blue", color: "#1c6fe0" },
    black: { label: "Black", color: "#1b1b1b" }, dbl: { label: "Double black", color: "#d6202a" },
    pro: { label: "Pro line", color: "#e8590c" },
  };
  const UNRATED = "#8a8f98";
  function difficulty(tags) {
    const imba = parseFloat(tags["mtb:scale:imba"]), sts = parseInt(tags["mtb:scale"], 10);
    if (!isNaN(imba)) return imba < 2 ? "green" : imba < 3 ? "blue" : imba < 4 ? "black" : imba < 5 ? "dbl" : "pro";
    if (!isNaN(sts)) return sts <= 1 ? "green" : sts === 2 ? "blue" : sts === 3 ? "black" : sts === 4 ? "dbl" : "pro";
    return null;
  }

  function lengthM(coords) {
    let m = 0;
    for (let i = 1; i < coords.length; i++) {
      const [lon1, lat1] = coords[i - 1], [lon2, lat2] = coords[i], r = Math.PI / 180;
      const a = Math.sin(((lat2 - lat1) * r) / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(((lon2 - lon1) * r) / 2) ** 2;
      m += 12742000 * Math.asin(Math.sqrt(a));
    }
    return m;
  }
  const lineOf = (g) => { const c = []; for (let i = 0; i < g.length; i += 2) c.push([g[i + 1], g[i]]); return c; };

  // ---------- data: the same nightly files the main map reads ----------
  // trails-<zone>.json: paths first mapped in the last 2 years; mtb-<zone>.json: every MTB trail, any age.
  const files = new Map();
  const getJson = (name) => {
    if (!files.has(name)) files.set(name, fetch("data/" + name, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null));
    return files.get(name);
  };
  const zoneData = new Map();   // zone id -> { newer: [...], all: [...] } once loaded

  async function loadZone(z) {
    if (zoneData.has(z.id)) return;
    zoneData.set(z.id, null);
    const [t, a] = await Promise.all([getJson(`trails-${z.id}.json`), getJson(`mtb-${z.id}.json`)]);
    const newer = [], all = [];
    if (t && t.ways) {
      const routeTypes = new Map();
      Object.values(t.rels || {}).forEach((r) => r.ways.forEach((w) => { if (!routeTypes.has(w)) routeTypes.set(w, []); routeTypes.get(w).push(r.tags.route); }));
      Object.entries(t.ways).forEach(([id, w]) => {
        const rt = routeTypes.get(+id) || [], cat = category(w.tags, rt);
        if (!cat || hiddenUse(w.tags, rt) || w.g.length < 4) return;
        const coords = lineOf(w.g), len = lengthM(coords);
        if (len < 60) return;
        newer.push({ id: +id, tags: w.tags, coords, len, cat, first: w.ft || (w.v === 1 ? w.t : null), mapper: w.fu || (w.v === 1 ? w.u : null) });
      });
    }
    if (a && a.ways) {
      const inMtb = new Set(Object.values(a.routes || {}).flatMap((r) => r.ways));
      Object.entries(a.ways).forEach(([id, w]) => {
        const rt = inMtb.has(+id) ? ["mtb"] : [], cat = category(w.tags, rt);
        if (!cat || hiddenUse(w.tags, rt) || w.g.length < 4) return;
        const coords = lineOf(w.g);
        all.push({ id: +id, tags: w.tags, coords, len: lengthM(coords), cat });
      });
    }
    zoneData.set(z.id, { newer, all, hasAll: !!(a && a.ways), hasNew: !!(t && t.ways) });
    redraw();
  }

  function feature(t, kind) {
    const d = difficulty(t.tags);
    return {
      type: "Feature", id: t.id,
      geometry: { type: "LineString", coordinates: t.coords },
      properties: { id: t.id, kind, name: t.tags.name || "", diff: d || "", color: d ? DIFF[d].color : UNRATED, cat: t.cat, len: Math.round(t.len), first: t.first || "", mapper: t.mapper || "" },
    };
  }
  function redraw() {
    if (!map || !map.getSource("new")) return;
    const cutoff = Date.now() - state.months * 30.44 * 864e5;
    const newer = [], all = [], seen = new Set();
    let anyAll = false, loaded = 0;
    zoneData.forEach((d) => {
      if (!d) return;
      loaded++;
      if (d.hasAll) anyAll = true;
      d.newer.forEach((t) => { if (t.first && Date.parse(t.first) >= cutoff && !seen.has(t.id)) { seen.add(t.id); newer.push(feature(t, "new")); } });
    });
    zoneData.forEach((d) => { if (d) d.all.forEach((t) => { if (!seen.has(t.id)) { seen.add(t.id); all.push(feature(t, "all")); } }); });
    map.getSource("new").setData({ type: "FeatureCollection", features: newer });
    map.getSource("all").setData({ type: "FeatureCollection", features: all });
    if (!loaded) return;
    const period = { 1: "month", 6: "6 months", 12: "year", 24: "2 years" }[state.months];
    const parts = [`${newer.length} new trail${newer.length === 1 ? "" : "s"} in the last ${period}`];
    if (anyAll) parts.push(`${all.length} other MTB trails`);
    setStatus(parts.join(", ") + " in the loaded areas." + (anyAll ? "" : " The list of all MTB trails isn't on the site yet (it comes from a daily job), so only new trails show for now."), !anyAll && state.showAll);
  }

  // Load the zones the camera is looking at.
  function loadVisible() {
    const b = map.getBounds();
    ZONES.forEach((z) => {
      const [s, w, n, e] = z.box;
      if (w <= b.getEast() && e >= b.getWest() && s <= b.getNorth() && n >= b.getSouth()) loadZone(z);
    });
  }

  // ---------- map ----------
  const state = {
    months: [1, 6, 12, 24].includes(store.get("months", 6)) ? store.get("months", 6) : 6,
    exag: store.get("3dExag", 1.5),
    showNew: store.get("3dNew", true), showAll: store.get("3dAll", true),
    showNames: store.get("3dNames", true), showPlaces: store.get("3dPlaces", true),
  };
  const startZone = ZONES.find((z) => z.id === store.get("zone", "wh")) || ZONES[2];
  const hasHash = /^#\d/.test(location.hash);

  // Keyless sources: Esri World Imagery (satellite photos), Esri reference labels, and AWS Terrain Tiles
  // (Terrarium-encoded heights, from public elevation data) for the 3D ground.
  const style = {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      sat: { type: "raster", tileSize: 256, maxzoom: 19, tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "Imagery © Esri, Maxar, Earthstar Geographics, and the GIS User Community" },
      places: { type: "raster", tileSize: 256, maxzoom: 19, tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"] },
      roads: { type: "raster", tileSize: 256, maxzoom: 19, tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}"] },
      dem: { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15, tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        attribution: "Terrain: <a href=\"https://registry.opendata.aws/terrain-tiles/\">Mapzen Terrain Tiles</a>" },
      // A second copy of the heights for the shading: MapLibre renders better when hillshade and terrain don't share a source.
      demHill: { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15, tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"] },
      new: { type: "geojson", data: { type: "FeatureCollection", features: [] }, attribution: "Trails © <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors" },
      all: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
    },
    layers: [
      { id: "sat", type: "raster", source: "sat" },
      { id: "hill", type: "hillshade", source: "demHill", paint: { "hillshade-exaggeration": 0.25, "hillshade-shadow-color": "#1a2a22" } },
      { id: "roads", type: "raster", source: "roads", paint: { "raster-opacity": 0.55 } },
      { id: "places", type: "raster", source: "places" },
      { id: "all-line", type: "line", source: "all", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1.2, 15, 2.5, 18, 4], "line-opacity": 0.9 } },
      { id: "new-edge", type: "line", source: "new", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": ["interpolate", ["linear"], ["zoom"], 11, 3, 15, 6, 18, 8.5] } },
      { id: "new-line", type: "line", source: "new", layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": ["get", "color"], "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1.6, 15, 3.5, 18, 5.5] } },
      { id: "names", type: "symbol", source: "all", minzoom: 13.5, filter: ["!=", ["get", "name"], ""],
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": 12, "text-max-angle": 30 },
        paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.75)", "text-halo-width": 1.4 } },
      { id: "new-names", type: "symbol", source: "new", minzoom: 12.5, filter: ["!=", ["get", "name"], ""],
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": ["Open Sans Semibold"], "text-size": 13, "text-max-angle": 30 },
        paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.8)", "text-halo-width": 1.6 } },
    ],
    terrain: { source: "dem", exaggeration: state.exag },
    sky: { "sky-color": "#7fb2e6", "horizon-color": "#dfeaf3", "fog-color": "#dfeaf3", "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.5, "fog-ground-blend": 0.75, "atmosphere-blend": 0.8 },
  };

  if (!window.maplibregl) { setStatus("The 3D map library didn't load. Check the connection and reload.", true); return; }
  const map = new maplibregl.Map({
    container: "map", style, hash: true, maxPitch: 85,
    bounds: hasHash ? undefined : zoneBounds(startZone), fitBoundsOptions: { padding: 30 },
    pitch: hasHash ? undefined : 60, bearing: hasHash ? undefined : -15,
  });
  window.trailMap = map;   // handy for debugging in the browser console
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
  map.addControl(new maplibregl.TerrainControl({ source: "dem", exaggeration: state.exag }), "top-right");
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), "top-right");
  map.addControl(new maplibregl.FullscreenControl(), "top-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");

  function applyVisibility() {
    const vis = (on) => (on ? "visible" : "none");
    ["new-edge", "new-line"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(state.showNew)));
    ["all-line"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(state.showAll)));
    map.setLayoutProperty("names", "visibility", vis(state.showNames && state.showAll));
    map.setLayoutProperty("new-names", "visibility", vis(state.showNames && state.showNew));
    ["places", "roads"].forEach((l) => map.setLayoutProperty(l, "visibility", vis(state.showPlaces)));
  }

  map.on("load", () => {
    applyVisibility();
    loadVisible();
  });
  map.on("moveend", loadVisible);
  map.on("error", (e) => { if (e && e.error && !e.sourceId) console.warn(e.error); });

  // ---------- trail details on tap ----------
  const fmtLen = (m) => (m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m} m`);
  const fmtDate = (s) => new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  const HIT = ["new-line", "new-edge", "all-line"];
  map.on("click", (e) => {
    const p = e.point, pad = 10;
    const hits = map.queryRenderedFeatures([[p.x - pad, p.y - pad], [p.x + pad, p.y + pad]], { layers: HIT.filter((l) => map.getLayoutProperty(l, "visibility") !== "none") });
    if (!hits.length) return;
    const f = hits.find((h) => h.properties.kind === "new") || hits[0], q = f.properties;
    const d = q.diff ? DIFF[q.diff] : null;
    const html = `<div class="pop">
      <h3>${esc(q.name || "Unnamed trail")}</h3>
      <p>${d ? `<span class="diff" style="background:${d.color}">${d.label}</span>` : `<span class="tag">Not rated</span>`} <span class="tag">${CAT_LABEL[q.cat] || ""}</span>${q.kind === "new" ? ` <span class="tag">New</span>` : ""}</p>
      <p>${fmtLen(q.len)} long</p>
      ${q.first ? `<p>First mapped ${fmtDate(q.first)}${q.mapper ? ` by ${esc(q.mapper)}` : ""}</p>` : ""}
      <p><a href="https://www.openstreetmap.org/way/${q.id}" target="_blank" rel="noopener">Open on OpenStreetMap</a></p>
    </div>`;
    new maplibregl.Popup({ maxWidth: "280px" }).setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on("mousemove", (e) => {
    const p = e.point, pad = 6;
    const ok = map.isStyleLoaded() && map.queryRenderedFeatures([[p.x - pad, p.y - pad], [p.x + pad, p.y + pad]], { layers: HIT }).length;
    map.getCanvas().style.cursor = ok ? "pointer" : "";
  });

  // ---------- panel ----------
  const zoneSel = $("zone");
  zoneSel.innerHTML = `<option value="">Choose an area…</option>` + ZONES.map((z) => `<option value="${z.id}">${esc(z.name)}</option>`).join("");
  zoneSel.addEventListener("change", () => {
    const z = ZONES.find((x) => x.id === zoneSel.value);
    if (!z) return;
    store.set("zone", z.id);
    map.fitBounds(zoneBounds(z), { padding: 30, pitch: 60, bearing: -15, duration: 2500 });
  });

  const monthBtns = [...$("months").querySelectorAll("button")];
  const syncMonths = () => monthBtns.forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.m === state.months)));
  monthBtns.forEach((b) => b.addEventListener("click", () => { state.months = +b.dataset.m; store.set("months", state.months); syncMonths(); redraw(); }));
  syncMonths();

  [["showNew", "3dNew"], ["showAll", "3dAll"], ["showNames", "3dNames"], ["showPlaces", "3dPlaces"]].forEach(([id, key]) => {
    const el = $(id); el.checked = state[id];
    el.addEventListener("change", () => { state[id] = el.checked; store.set(key, el.checked); if (map.isStyleLoaded()) applyVisibility(); redraw(); });
  });

  const exag = $("exag");
  const syncExag = () => { $("exagVal").textContent = `×${state.exag.toFixed(1)}`; };
  exag.value = state.exag; syncExag();
  exag.addEventListener("input", () => {
    state.exag = +exag.value; store.set("3dExag", state.exag); syncExag();
    if (map.getTerrain()) map.setTerrain({ source: "dem", exaggeration: state.exag });
  });

  const fold = $("fold"), panel = $("panel");
  const setFold = (closed) => { panel.classList.toggle("closed", closed); fold.textContent = closed ? "Show" : "Hide"; fold.setAttribute("aria-expanded", String(!closed)); store.set("3dFold", closed); };
  setFold(store.get("3dFold", window.innerWidth < 600));
  fold.addEventListener("click", () => setFold(!panel.classList.contains("closed")));
})();
</script>
</body>
</html>
