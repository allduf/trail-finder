// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // MapLibre Native with 3D mountains for the TrailMap plugin (plugins/TrailMap/android/build.gradle): a community
        // build read from one fixed commit, for that one library only; its sha256 is checked before every build.
        exclusiveContent {
            forRepository {
                maven { url = "https://raw.githubusercontent.com/WxByte/maplibre-native-maven/ff565a677d6f3ba8e7e0af4b1ceb3c53d3e9025a" }
            }
            filter { includeModule("org.maplibre.gl", "android-sdk-opengl") }
        }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
