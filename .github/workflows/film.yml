name: Film (loam tutorial, branch only)

# Branch-only (not for main): films the Loam moisture index tutorial. Jobs to run are listed in scripts/film/jobs.json
# (os "web" = Chromium at iPhone size on ubuntu, "ios" = the iPhone simulator on macOS). Results: artifacts film-<name>.
on:
  push:
    branches: [claude/project-thread-byzwur]
    paths: ["scripts/film/**", ".github/workflows/film.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.p.outputs.web }}
      ios: ${{ steps.p.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          node -e '
            const j = require("./scripts/film/jobs.json"), o = (k) => JSON.stringify({ include: j.filter((x) => x.os === k) });
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `web=${o("web")}\nios=${o("ios")}\n`);'
  web:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.web).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.web) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/i18n/build.mjs
      - run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Film
        run: env ${{ matrix.env }} PLATFORM=web node scripts/film/loam.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-${{ matrix.name }}
          path: out/film/
          if-no-files-found: ignore
  slot:
    # At most 2 heavy test runs at once (scripts/ci/heavy-slot.sh): the simulator jobs wait here.
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.ios).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Wait for a free heavy test slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/heavy-slot.sh
  ios:
    needs: [plan, slot]
    if: ${{ fromJSON(needs.plan.outputs.ios).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ios) }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90   # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: French words (i18n-fr.js)
        run: node scripts/i18n/build.mjs
      - name: Test build for the simulator (opens this runner's site)
        working-directory: ios-app
        run: |
          npm ci
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json"));
            c.server.url = "http://localhost:8080/"; c.server.cleartext = true; c.server.allowNavigation.push("localhost");
            c.ios.limitsNavigationsToAppBoundDomains = false;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));'
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains: string localhost" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $P || true
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=99999 build > "$RUNNER_TEMP/xb.log" 2>&1 || { grep -E "error:|warning: unre" "$RUNNER_TEMP/xb.log" | head -40; tail -5 "$RUNNER_TEMP/xb.log"; exit 1; }; tail -3 "$RUNNER_TEMP/xb.log"
      - name: iPhone simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | node -e '
            const d = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat().filter((x) => /^iPhone/.test(x.name));
            const p = d.find((x) => /Pro Max/.test(x.name)) || d.find((x) => /Plus/.test(x.name)) || d[0]; console.log(p.udid); console.error(p.name);')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install booted "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl privacy booted grant location-always com.allduf.trailfinder || true
          xcrun simctl location booted set 49.3536,-123.0889 || true
          xcrun simctl status_bar booted override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          system_profiler SPDisplaysDataType | head -20 || true
      - name: Film
        run: env ${{ matrix.env }} PLATFORM=ios node scripts/film/loam.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-${{ matrix.name }}
          path: out/film/
          if-no-files-found: ignore
