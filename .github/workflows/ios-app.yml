name: iPhone app

# Builds the iPhone app (ios-app/: the website in a Capacitor shell) and sends it to TestFlight.
# The app opens the live website, so website changes reach the app without a new build.
# A new build is only needed when ios-app/ changes, and once a month so TestFlight builds never hit their 90-day expiry.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   10-character Team ID from developer.apple.com > Account > Membership details
#   ASC_KEY_ID      App Store Connect > Users and Access > Integrations > App Store Connect API: the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_XXXX.p8 file
# Without them the job just says so and stops.
on:
  push:
    branches: [main]
    paths: ["ios-app/**", ".github/workflows/ios-app.yml"]
  # A pull request that changes the app only gets a test build (no Apple key, nothing sent to TestFlight),
  # so a native change that doesn't compile shows up before it's merged.
  pull_request:
    paths: ["ios-app/**", ".github/workflows/ios-app.yml"]
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build-check:
    if: github.event_name == 'pull_request'
    # Intel Macs: the arm64 ones were out of capacity on 2026-10-27 (jobs never got a runner, cancelled after 15 min).
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test build (unsigned)
        run: |
          npm ci
          npx cap sync ios
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60

  testflight:
    if: github.event_name != 'pull_request'
    # Intel Macs: the arm64 ones were out of capacity on 2026-10-27 (jobs never got a runner, cancelled after 15 min).
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-app
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the Apple secrets
        id: keys
        working-directory: .
        # The three IDs reach later steps only through GITHUB_ENV, trimmed (a job-level env would win over it).
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Apple secrets not set yet, so no iPhone build. See the top of .github/workflows/ios-app.yml."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            # Pasted values often carry a stray space or line break; use them trimmed from here on.
            for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
              t=$(printf '%s' "${!v}" | tr -d ' \r\n\t')
              echo "::add-mask::$t"
              echo "$v=$t" >> "$GITHUB_ENV"
            done
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.keys.outputs.ok == 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Prepare the Xcode project
        if: steps.keys.outputs.ok == 'true'
        run: |
          npm ci
          npx cap sync ios
          mkdir -p "$RUNNER_TEMP/keys"
          # Rebuild the .p8 from just its key text, so a paste with Windows line ends, lost line breaks or extra spaces still works.
          body=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/keys/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 isn't a valid key (${#body} key characters, a real one has about 184). Open the AuthKey_XXXX.p8 file in Notepad, copy everything, and paste it again as the ASC_KEY_P8 secret."
            exit 1
          fi
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
      - name: Check the key with Apple
        if: steps.keys.outputs.ok == 'true'
        run: node check-key.mjs "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Build
        if: steps.keys.outputs.ok == 'true'
        # Archived unsigned: xcodebuild's API-key login only works for the export below, which signs it
        # (archiving with the key gets a 401 from Apple's listTeams).
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Send to TestFlight
        if: steps.keys.outputs.ok == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build ${{ github.run_number }} sent to TestFlight. Apple takes about 10-30 minutes to process it."
      - name: Remove the key
        if: always()
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/keys"
