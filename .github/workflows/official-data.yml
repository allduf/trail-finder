name: Official trails data

# Every Sunday, collect official (sanctioned) trails from government open data (Ontario Trail Network, Sépaq,
# Recreation Sites and Trails BC, Alberta designated trails, Parks Canada, City of Ottawa) into data/official/,
# for the "Official" badge on trails across Canada (official.js).
# On a pull request that changes the script it only does a test run, without saving anything.
on:
  schedule:
    - cron: "41 10 * * 0"   # Sundays 10:41 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:                     # right away when a source is added or changed, not on the next Sunday
    branches: [main]
    paths:
      - scripts/build-official.mjs
  pull_request:
    paths:
      - scripts/build-official.mjs
      - .github/workflows/official-data.yml

permissions:
  contents: write   # save the data files (site-data branch)
  actions: write    # start "Publish website" afterwards

concurrency:
  group: official-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect official trails
        run: node scripts/build-official.mjs
      - name: File sizes
        run: du -sh data/official && ls data/official | wc -l
      - name: Save the new data
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Official trails data" data/official
      - name: Publish the website
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "The website will publish with the next data job."
