name: Daily app errors

# Each morning: the errors (and crash restarts, with what the phone did just before) the iPhone app sent the day before (usage report, supabase/usage.sql), counted once each,
# with the sport and what the tester tapped just before, written on the GitHub issue "App errors". New errors mention
# alex (GitHub emails them). See scripts/app-errors.mjs. On a pull request that changes it: summary only, no comment.
# Needs the repository secret SUPABASE_SECRET_KEY (the same one the loam alerts use).
on:
  schedule:
    - cron: "17 15 * * *"   # 15:17 UTC, 8:17 am in BC (summer time)
  pull_request:
    paths: ["scripts/app-errors.mjs", "scripts/usage-cleanup.mjs", ".github/workflows/app-errors.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the "App errors" issue

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sum up yesterday's errors
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: allduf
          DRY: ${{ github.event_name == 'pull_request' && '1' || '' }}
          # A pull request looks back 14 days of errors and crashes, to see what they have in common.
          HOURS: ${{ github.event_name == 'pull_request' && '336' || '' }}
          CRASH_HOURS: ${{ github.event_name == 'pull_request' && '336' || '' }}
        run: node scripts/app-errors.mjs
      - name: Delete usage events and visit codes older than a year (privacy page promise)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/usage-cleanup.mjs
