name: Weekly possible unmapped trails

# Once a week, look through OpenStreetMap's public GPS traces for lines people ride that aren't mapped yet,
# and save them in data/unmapped-<zone>.json for the site's "Possible unmapped" layer.
# Squares are done in rotation (a few thousand trace pages per run), so the whole region refreshes over a few weeks.
on:
  schedule:
    - cron: "41 11 * * 0"   # Sundays, 11:41 UTC (early morning in Vancouver)
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write   # save the data files (site-data branch)
  pages: write      # ask GitHub Pages to publish them

concurrency:
  group: trail-data   # never at the same time as the nightly trail data, both commit to data/
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for possible unmapped trails
        run: node scripts/find-unmapped.mjs
      - name: Save the new data
        if: github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Weekly possible unmapped trails" 'data/unmapped-*.json'
      - name: Publish the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
