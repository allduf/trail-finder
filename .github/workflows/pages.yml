name: Publish website

# Publishes the website: main as it stands, plus the data jobs' files from the site-data branch under data/
# (scripts/site-data.sh), the Canada-wide trail data from the canada-data branch under ca/ (both kept out of main's
# history, so the repository doesn't grow each time they're rebuilt). The 3D map's Winter photos (winter-photos
# branch, ~590 MB) are their own site since 2026-10-26: allduf/trail-finder-winter publishes them at
# allduf.github.io/trail-finder-winter/, so this site stays well under GitHub Pages' 1 GB.
# Runs after every push to main and after every data job (their saves don't start workflows by themselves).
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Canada trail data", "Nightly trail data", "All trails data", "Trailheads and parking data", "Forest roads data",
      "Wildfires data", "Winter data", "Weekly alpine rideable trails", "Weekly ski heatmap", "Weekly possible unmapped trails", "People count",
      "Hunting data", "Trail data audit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a newer publish has everything an older one has

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Add the data jobs' files
        working-directory: site
        run: bash scripts/site-data.sh get
      - name: Add the Canada-wide data
        run: |
          git clone -q --depth 1 --branch canada-data "https://github.com/${GITHUB_REPOSITORY}.git" canada || { echo "No canada-data branch yet."; exit 0; }
          mv canada/ca site/ca
      - name: Leave out what the website doesn't need
        run: rm -rf site/.git site/.github site/scripts site/supabase site/ios-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
