name: Publish website

# Publishes the website: main as it stands, plus the data jobs' files from the site-data branch under data/
# (scripts/site-data.sh), the Canada-wide trail data from the canada-data branch under ca/ and the Japan ski data from
# the japan-data branch under jp/ (all kept out of main's
# history, so the repository doesn't grow each time they're rebuilt). The 3D map's Winter photos (winter-photos
# branch, ~590 MB) are their own site since 2026-10-26: allduf/trail-finder-winter publishes them at
# allduf.github.io/trail-finder-winter/, so this site stays well under GitHub Pages' 1 GB.
# Runs after every push to main and after every data job (their saves don't start workflows by themselves).
# Since 2026-11-07 (GitHub suspension) the site is hosted on Cloudflare Pages (project "trailfinderapp", free, no size
# limit) and trailfinderapp.ca's DNS is on Cloudflare: this job publishes there with wrangler. Needs the repository secret
# CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). Only changed files are uploaded. Winter photos are on 18 Cloudflare
# Pages sites trailfinder-w1-0..13 / trailfinder-w2-0..3 (map3d.js tfWinterShard), not built here.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Canada trail data", "Nightly trail data", "All trails data", "Trailheads and parking data", "Forest roads data",
      "Wildfires data", "Winter data", "Weekly alpine rideable trails", "Weekly ski heatmap", "Weekly possible unmapped trails", "People count",
      "Hunting data", "Trail data audit", "Japan ski data", "Weekly hiking trails"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true   # a newer publish has everything an older one has

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0        # main's history (no file contents) for the version number: scripts/stamp.mjs
          filter: blob:none
      - name: Set the version number, What's new and French (scripts/stamp.mjs)
        # Pull requests never set ?v= / tf- numbers, data/changelog.json lines or i18n-fr.js by hand (2026-11-19): they
        # are made here, the same for every publish of the same main, one number higher after each merge.
        # Before the data files: site-data.sh fetches its branch with --depth 1, which marks the checkout shallow.
        working-directory: site
        run: node scripts/stamp.mjs
      - name: App link files (shared links open in the iPhone and Android apps)
        # .well-known/apple-app-site-association and .well-known/assetlinks.json tell the phone which trailfinderapp.ca
        # links (#pin=, #trail=, #route=, #trip=, #live=) open in the installed app. The app's IDs are filled in here from
        # the secrets, so they stay out of the repository. A file whose ID is missing is left out (links then open the website).
        # PLAY_SIGNING_SHA256: Play Console > Test and release > App integrity > App signing key certificate > SHA-256.
        working-directory: site
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLAY_SIGNING_SHA256: ${{ secrets.PLAY_SIGNING_SHA256 }}
          ANDROID_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          team=$(printf '%s' "$APPLE_TEAM_ID" | tr -d ' \r\n\t')
          if printf '%s' "$team" | grep -Eq '^[A-Z0-9]{10}$'; then
            sed -i "s/__APPLE_TEAM_ID__/$team/g" .well-known/apple-app-site-association
          else
            echo "::warning::No APPLE_TEAM_ID secret: shared links won't open the iPhone app."; rm -f .well-known/apple-app-site-association
          fi
          certs=()
          play=$(printf '%s' "$PLAY_SIGNING_SHA256" | tr -d ' \r\n\t' | tr 'a-f' 'A-F')
          if printf '%s' "$play" | grep -Eq '^([0-9A-F]{2}:){31}[0-9A-F]{2}$'; then certs+=("$play")
          else echo "::warning::No PLAY_SIGNING_SHA256 secret (or not a SHA-256 like AB:CD:...): apps installed from Google Play won't open shared links."; fi
          if [ -n "$ANDROID_UPLOAD_KEY" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            # The upload key signs the test .apk from android-app.yml.
            printf '%s' "$ANDROID_UPLOAD_KEY" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload.jks" 2>/dev/null || true
            pw=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n'); echo "::add-mask::$pw"
            up=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$pw" -alias upload 2>/dev/null | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 || true)
            rm -f "$RUNNER_TEMP/upload.jks"
            if [ -n "$up" ] && [ "$up" != "$play" ]; then certs+=("$up"); fi
          fi
          if [ ${#certs[@]} -gt 0 ]; then
            list=$(printf '"%s", ' "${certs[@]}"); list=${list%, }; list=${list#\"}; list=${list%\"}
            sed -i "s/__ANDROID_CERTS__/$list/" .well-known/assetlinks.json
          else
            rm -f .well-known/assetlinks.json
          fi
          ls -la .well-known/ || true
      - name: Add the data jobs' files
        working-directory: site
        run: bash scripts/site-data.sh get
      - name: Add the Canada-wide data
        run: |
          git clone -q --depth 1 --branch canada-data "https://github.com/${GITHUB_REPOSITORY}.git" canada || { echo "No canada-data branch yet."; exit 0; }
          mv canada/ca site/ca
      - name: Add the Japan ski data (Skiing only)
        run: |
          git clone -q --depth 1 --branch japan-data "https://github.com/${GITHUB_REPOSITORY}.git" japan || { echo "No japan-data branch yet."; exit 0; }
          mv japan/jp site/jp
      - name: Leave out what the website doesn't need
        run: rm -rf site/.git site/.github site/scripts site/supabase site/ios-app site/old-address site/data/changelog.d
      - name: Publish to Cloudflare Pages (trailfinderapp.ca)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9ad76bdf11abb4440ad064451cf06d9a
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."; exit 1; fi
          npx --yes wrangler@4.160.1 pages deploy site --project-name trailfinderapp --branch main --commit-dirty=true
