name: Publish website

# Publishes the website: main as it stands, plus the data jobs' files from the site-data branch under data/
# (scripts/site-data.sh), the Canada-wide trail data from the canada-data branch under ca/ and the Japan ski data from
# the japan-data branch under jp/ (all kept out of main's
# history, so the repository doesn't grow each time they're rebuilt). The 3D map's Winter photos (winter-photos
# branch, ~590 MB) are their own site since 2026-10-26: allduf/trail-finder-winter publishes them at
# allduf.github.io/trail-finder-winter/, so this site stays well under GitHub Pages' 1 GB.
# Runs after every push to main and after every data job (their saves don't start workflows by themselves).
# Since 2026-11-07 (GitHub suspension) the site is hosted on Cloudflare Pages (project "trailfinderapp", free, no size
# limit) and trailfinderapp.ca's DNS is on Cloudflare: this job publishes there with wrangler. Needs the repository secret
# CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). Only changed files are uploaded. Winter photos are on 18 Cloudflare
# Pages sites trailfinder-w1-0..13 / trailfinder-w2-0..3 (map3d.js tfWinterShard), not built here.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Canada trail data", "Nightly trail data", "All trails data", "Trailheads and parking data", "Forest roads data",
      "Wildfires data", "Winter data", "Weekly alpine rideable trails", "Weekly ski heatmap", "Weekly possible unmapped trails", "People count",
      "Hunting data", "Trail data audit", "Japan ski data", "Weekly hiking trails"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true   # a newer publish has everything an older one has

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Add the data jobs' files
        working-directory: site
        run: bash scripts/site-data.sh get
      - name: Add the Canada-wide data
        run: |
          git clone -q --depth 1 --branch canada-data "https://github.com/${GITHUB_REPOSITORY}.git" canada || { echo "No canada-data branch yet."; exit 0; }
          mv canada/ca site/ca
      - name: Add the Japan ski data (Skiing only)
        run: |
          git clone -q --depth 1 --branch japan-data "https://github.com/${GITHUB_REPOSITORY}.git" japan || { echo "No japan-data branch yet."; exit 0; }
          mv japan/jp site/jp
      - name: Leave out what the website doesn't need
        run: rm -rf site/.git site/.github site/scripts site/supabase site/ios-app site/old-address
      - name: Publish to Cloudflare Pages (trailfinderapp.ca)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9ad76bdf11abb4440ad064451cf06d9a
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."; exit 1; fi
          npx --yes wrangler@4 pages deploy site --project-name trailfinderapp --branch main --commit-dirty=true
