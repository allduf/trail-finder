name: Dirt roads, all of Canada (ADV topo far view)

# Every gravel and dirt road in Canada as map tiles, for Adventure moto's ADV topo map (adv-map.js) at zooms 7 to 12
# (alex 2026-11-17: "Yes, build it"). OpenFreeMap's tiles only carry unpaved roads from zoom 13 and tracks from 14,
# so further out the map showed almost none outside BC.
# Each province's OpenStreetMap extract (Geofabrik) -> osmium keeps the roads -> scripts/build-dirt-roads.mjs keeps
# tracks and unpaved roads -> tippecanoe makes vector tiles (zooms 7-11; the map enlarges 11 for 12) -> four Cloudflare
# Pages sites trailfinder-dirt-k, k = (x * 31 + y) % 4 of the zoom-7 tile (Pages takes 20,000 files a site).
# Free: OpenStreetMap data (ODbL, credited on the map), GitHub's free minutes, Cloudflare Pages free.
# Weekly (roads don't change fast) and by hand. Needs the repository secret CLOUDFLARE_API_TOKEN, as pages.yml.
on:
  schedule:
    - cron: "43 9 * * 0"    # Sundays 09:43 UTC, after the nightly Canada job
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/dirt-roads.yml", "scripts/build-dirt-roads.mjs"]   # test build of one small province, no publish

permissions:
  contents: read

concurrency:
  group: dirt-roads
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PROVINCES: ${{ github.event_name == 'pull_request' && 'pe' || 'pe nl ns nb yt nt nu sk mb ab bc on qc' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler 4.160 needs Node 22.12+
      - name: Install osmium and tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool tippecanoe && tippecanoe --version
      - name: Download each province and keep its dirt roads
        run: |
          declare -A NAME=( [ab]=alberta [bc]=british-columbia [mb]=manitoba [nb]=new-brunswick [nl]=newfoundland-and-labrador
            [ns]=nova-scotia [nt]=northwest-territories [nu]=nunavut [on]=ontario [pe]=prince-edward-island [qc]=quebec
            [sk]=saskatchewan [yt]=yukon )
          echo '{"attributes":{"type":false,"id":false},"linear_tags":true,"area_tags":false}' > /tmp/export.json
          mkdir -p /tmp/osm
          : > /tmp/dirt.geojsonseq
          for p in $PROVINCES; do
            echo "::group::${NAME[$p]}"
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 60 -o /tmp/osm/p.pbf "https://download.geofabrik.de/north-america/canada/${NAME[$p]}-latest.osm.pbf"
            osmium tags-filter --overwrite -o /tmp/osm/r.pbf /tmp/osm/p.pbf w/highway=track,unclassified,tertiary,secondary,primary,road,residential,service
            rm /tmp/osm/p.pbf
            osmium export --overwrite -c /tmp/export.json --geometry-types=linestring -f geojsonseq -o /tmp/osm/r.geojsonseq /tmp/osm/r.pbf
            node scripts/build-dirt-roads.mjs keep /tmp/osm/r.geojsonseq >> /tmp/dirt.geojsonseq
            rm /tmp/osm/*
            echo "::endgroup::"
          done
          ls -lh /tmp/dirt.geojsonseq
      - name: Make the tiles and split them into four sites
        run: |
          # Tracks and roads only need their kind and name; lines are simplified for the far zooms, and the densest
          # are thinned only if a tile would pass 750 KB.
          tippecanoe -q -e /tmp/tiles -l dirt -Z7 -z11 --no-tile-compression --drop-densest-as-needed --simplification=4 \
            --maximum-tile-bytes=750000 -P --force /tmp/dirt.geojsonseq
          node scripts/build-dirt-roads.mjs split /tmp/tiles site
          du -sh site/*
      - name: Publish to Cloudflare Pages (trailfinder-dirt-0..3)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9ad76bdf11abb4440ad064451cf06d9a
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions)."; exit 1; fi
          for k in 0 1 2 3; do
            npx --yes wrangler@4.160.1 pages project create trailfinder-dirt-$k --production-branch main || true
            for try in 1 2 3; do npx --yes wrangler@4.160.1 pages deploy site/site$k --project-name trailfinder-dirt-$k --branch main --commit-dirty=true && break; [ $try = 3 ] && exit 1; sleep 30; done
          done
