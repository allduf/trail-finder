name: Trail directions data

# Every day, which way each trail of the region is ridden (climb, descent, one-way; both ways when nothing says) into
# data/directions.json (scripts/build-directions.mjs), used by directions.js for trail details and Plan a route.
# Runs after the all-trails lists it reads. On a pull request that changes the script it only does a test run, and
# prints the fields of the local open-data layers (PROBE) to look for a direction field.
on:
  schedule:
    - cron: "5 11 * * *"   # daily 11:05 UTC
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/build-directions.mjs
      - directions.js
  pull_request:
    paths:
      - scripts/build-directions.mjs
      - directions.js
      - .github/workflows/directions-data.yml

permissions:
  contents: write   # commit the data file
  actions: write    # start "Publish website" afterwards

concurrency:
  group: directions-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out trail directions
        env:
          PROBE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/build-directions.mjs
      - name: Save the new data
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Trail directions data" data/directions.json
      - name: Publish the website
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "The website will publish with the next data job."
