name: Tough conditions (phone apps)

# The iPhone and Android apps in the conditions phones really meet (alex 2026-11-27: "can we test the app in all
# different situation ? like low data , off line"): dark mode, the biggest text size, background and back and the low
# memory warning with native 3D open (never a black map), no signal (Android airplane mode; iPhone: the map servers
# silent), location off, turned sideways (the apps stay upright), and the first open with no connection (the app's own
# page, then the app by itself once the connection is back). scripts/conditions/native.mjs; the website's own
# conditions run on every pull request in phone-test.yml ("conditions"). Fails on a crash, a black 3D map, a page error,
# sideways scrolling or a check; screenshots in the "conditions-<phone>" download.
on:
  # A pull request that changes the apps, the native 3D map's page side or this test runs it.
  pull_request:
    paths: ["ios-app/**", "android-app/**", "native*.js", "scripts/conditions/**", ".github/workflows/conditions.yml"]
  # Every Friday 5 AM Pacific (13:00 UTC), on main.
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conditions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90   # v1.7.0, pinned to one exact version
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: French words (i18n-fr.js)
        run: node scripts/i18n/build.mjs
      - name: Test build for the simulator (opens this runner's site)
        working-directory: ios-app
        run: |
          npm ci
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json"));
            c.server.url = "http://localhost:8080/"; c.server.cleartext = true; c.server.allowNavigation.push("localhost");
            c.ios.limitsNavigationsToAppBoundDomains = false;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            fs.writeFileSync("www/offline.html", fs.readFileSync("www/offline.html", "utf8").replace("https://trailfinderapp.ca/", "http://localhost:8080/"));'
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains: string localhost" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $P || true
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=99999 build | tail -30   # newer than any TestFlight build: no "New version" card
      - name: iPhone simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | node -e '
            const d = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat().filter((x) => /^iPhone/.test(x.name));
            const p = d.find((x) => /Pro Max/.test(x.name)) || d.find((x) => /Plus/.test(x.name)) || d[0]; console.log(p.udid); console.error(p.name);')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install booted "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl privacy booted grant location-always com.allduf.trailfinder || true
          xcrun simctl location booted set 50.11,-122.95 || true
          xcrun simctl status_bar booted override --time 9:41 || true
      - name: Tough conditions
        run: PLATFORM=ios node scripts/conditions/native.mjs
      - name: The app's crash reports, if it crashed
        if: always()
        run: |
          mkdir -p out/conditions-ios/crashes
          find ~/Library/Logs/DiagnosticReports -name 'App*' -newer ios-app/package.json -exec cp {} out/conditions-ios/crashes/ \; 2>/dev/null || true
          for f in out/conditions-ios/crashes/*; do [ -f "$f" ] && { echo "::group::$f"; head -c 20000 "$f"; echo "::endgroup::"; }; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditions-iphone
          path: out/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: French words (i18n-fr.js)
        run: node scripts/i18n/build.mjs
      - name: Install
        working-directory: android-app
        run: npm ci
      - name: Phone notifications (Firebase)
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        # As android-app.yml: with the secret the app offers notifications like the real build.
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && printf '%s' "$GOOGLE_SERVICES_JSON" | node -e 'const j = JSON.parse(require("fs").readFileSync(0, "utf8")); if (!(j.project_info && j.project_info.project_id && (j.client || []).some((c) => c.client_info && c.client_info.android_client_info && c.client_info.android_client_info.package_name === "com.allduf.trailfinder"))) process.exit(1)'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            npm uninstall --no-save @capacitor/push-notifications
          fi
      - name: Test build (opens this runner's site through adb reverse)
        working-directory: android-app
        run: |
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json"));
            c.server.url = "http://localhost:8080/"; c.server.cleartext = true; c.server.allowNavigation.push("localhost");
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            fs.writeFileSync("www/offline.html", fs.readFileSync("www/offline.html", "utf8").replace("https://trailfinderapp.ca/", "http://localhost:8080/"));'
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q
      - name: Turn on the simulator's speed-up (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tough conditions on an Android 14 simulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2.38.0, pinned to one exact version
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/conditions/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditions-android
          path: out/
          if-no-files-found: ignore
