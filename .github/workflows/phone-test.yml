name: Phone test

# Before a change goes live: opens the app at iPhone size in WebKit (Safari's engine, the same as the iPhone app) and
# goes through every sport like a rider: Sport button, each tab of the bottom bar, Layers, the 3D map; then the page as
# the phone apps open it (no web 3D map on an iPhone build with native 3D only, Skiing on Winter), then My rides.
# The check fails on a script error, a tap that breaks, or a page wider than the phone. Screenshots of every step are
# in the run's "phone-test-screenshots" download. Outside the app's own files only code libraries and map pictures
# are fetched (see scripts/phone-test.mjs): no resort or club sites, no weather, no Supabase.
# Next to it, "computer" runs the same steps on the website at computer size (and 3D turning with the mouse), and "switch" (alex 2026-11-22: "test every sport to switch to other sport to see every mode") switches every
# sport to every other one on the flat map, the 3D map, each map style, and the iPhone and Android apps' native 3D, and
# fails if anything of the sport before stays (scripts/sport-switch-test.mjs). Screenshots: "switch-test-screenshots".
on:
  pull_request:
    # ios-app/ runs it too since 2026-11-21: the "App builds" checks read the iPhone's native 3D keys (NativeLayers.swift),
    # and a pull request that drops one must fail before its build reaches phones.
    paths-ignore: ["data/**", "supabase/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-test-${{ github.ref }}
  cancel-in-progress: true   # a newer push has everything an older one has

jobs:
  phone:
    # Pinned (2026-11-11): ubuntu-latest moved to 26.04, where playwright 1.48.2's --with-deps asks for 24.04 packages
    # (libicu74, libvpx9, libx264-164) that aren't there, and the browser install failed before any test ran.
    runs-on: ubuntu-24.04
    # 45 (was 25), 2026-11-19: with archive.ubuntu.com slow, the browser's system files alone took over 20 min and runs
    # were cancelled near the end of the download. A normal run takes about 7 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Add the data jobs' files
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wording check (nothing that promises safety or conditions)
        run: node scripts/wording-check.mjs
      - name: Version number, What's new and French as the website gets them (scripts/stamp.mjs)
        run: node scripts/stamp.mjs --test
      - name: Trim the scripts as the website gets them (scripts/trim-site.mjs)
        # The publish trims comments and spaces (alex 2026-11-26), so the tests run on that same trimmed copy.
        run: node scripts/trim-site.mjs . --strict
      - name: Install the test browser
        # The runner's Ubuntu mirror (azure.archive.ubuntu.com) stopped sending files on 2026-11-11 and the install
        # hung until the 25 min limit, twice. The browser's system files come from the main Ubuntu mirror instead, and
        # apt gives up on a dead download after 15 s and tries again, not 20 s per file forever.
        # 2026-11-18: runners came up on us-east-2.ec2.archive.ubuntu.com instead (about 1 small file a second, the
        # install hit 25 min three times on PR #808), so every regional mirror name is switched, not only azure's.
        # Newer runners list mirrors through "mirror+file:/etc/apt/apt-mirrors.txt", so that file is rewritten too.
        # 2026-11-19: archive.ubuntu.com itself crawled (40 kB/s): apt update took 15 min, and one failed download of a
        # command-not-found list ("c-n-f Metadata") failed the whole install. Neither the translations nor those lists
        # are needed to install the browser's files, so apt no longer fetches them.
        run: |
          sudo sed -i -E 's#http://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g; s#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          [ -f /etc/apt/apt-mirrors.txt ] && echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
          grep -h "^URIs\|^deb " /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null | sort -u || true
          printf 'Acquire::http::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99tf-timeout >/dev/null
          printf 'Acquire::Languages "none";\nAcquire::IndexTargets::deb::CNF::DefaultEnabled "false";\n' | sudo tee /etc/apt/apt.conf.d/99tf-lean >/dev/null
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps webkit
      - name: Test every sport at iPhone size
        run: node scripts/phone-test.mjs
        env:
          OUT: phone-test-shots
          PART: phone
          NODE_OPTIONS: --max-old-space-size=4096   # see the computer job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-test-screenshots
          path: phone-test-shots
          retention-days: 14

  computer:
    # The website at computer size (alex 2026-11-25: its own line next to "phone", so a problem shows where it is), with
    # the same steps as "phone" (alex 2026-11-25: "can we test the same test on the computer test?"): wording check,
    # version and French build, then every sport at 1440 x 900 with a mouse (side panel and ☰ Menu instead of the bottom
    # bar, Layers, 3D, Skiing's 3D ground), the website opening Skiing on Winter, My rides, the sign-in check, and turning
    # Skiing's 3D map with the mouse (alex's recording 2026-11-24). Only the phone apps' checks ("App builds") stay in
    # "phone". scripts/phone-test.mjs PART=computer.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Add the data jobs' files
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wording check (nothing that promises safety or conditions)
        run: node scripts/wording-check.mjs
      - name: Version number, What's new and French as the website gets them (scripts/stamp.mjs)
        run: node scripts/stamp.mjs --test
      - name: Trim the scripts as the website gets them (scripts/trim-site.mjs)
        # The publish trims comments and spaces (alex 2026-11-26), so the tests run on that same trimmed copy.
        run: node scripts/trim-site.mjs . --strict
      - name: Install the test browser
        # The same mirror fixes as the phone job above.
        run: |
          sudo sed -i -E 's#http://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g; s#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          [ -f /etc/apt/apt-mirrors.txt ] && echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
          printf 'Acquire::http::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99tf-timeout >/dev/null
          printf 'Acquire::Languages "none";\nAcquire::IndexTargets::deb::CNF::DefaultEnabled "false";\n' | sudo tee /etc/apt/apt.conf.d/99tf-lean >/dev/null
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps webkit
      - name: Test the website at computer size
        run: node scripts/phone-test.mjs
        env:
          OUT: computer-test-shots
          PART: computer
          # 2026-11-26: the test program itself ran out of memory at Node's default 2 GB during Skiing 3D at 1440 x 900
          # (PR #953). The runner has 16 GB; 4 GB gives the 3D steps room.
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computer-test-screenshots
          path: computer-test-shots
          retention-days: 14

  switch:
    # Every sport to every other sport (scripts/sport-switch-test.mjs), beside the phone test so that one stays quick:
    # about 20 min in WebKit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Add the data jobs' files
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Trim the scripts as the website gets them (scripts/trim-site.mjs)
        # The publish trims comments and spaces (alex 2026-11-26), so the tests run on that same trimmed copy.
        run: node scripts/trim-site.mjs . --strict
      - name: Install the test browser
        # The same mirror fixes as the phone job above.
        run: |
          sudo sed -i -E 's#http://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g; s#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          [ -f /etc/apt/apt-mirrors.txt ] && echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
          grep -h "^URIs\|^deb " /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null | sort -u || true
          printf 'Acquire::http::Timeout "15";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99tf-timeout >/dev/null
          printf 'Acquire::Languages "none";\nAcquire::IndexTargets::deb::CNF::DefaultEnabled "false";\n' | sudo tee /etc/apt/apt.conf.d/99tf-lean >/dev/null
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps webkit
      - name: Switch every sport to every other sport
        run: node scripts/sport-switch-test.mjs
        env:
          OUT: switch-test-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-test-screenshots
          path: switch-test-shots
          retention-days: 14
