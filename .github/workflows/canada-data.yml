name: Canada trail data

# Every night, build trail data for all of Canada from Geofabrik's OpenStreetMap extracts (one file per province),
# so the website works anywhere in Canada. scripts/build-canada.mjs writes map chunks to out/ca/; they are kept on
# the canada-data branch (one commit, replaced each night, so the repo doesn't grow) and published with the
# website by pages.yml. They are never committed to main. The same run lists Canada's bike parks, pump tracks and
# MTB centres (scripts/build-bike-parks.mjs -> ca/bike-parks.json), the trailheads and parking near the trails
# (scripts/build-canada-access.mjs -> ca/a/), the forest roads near them (scripts/build-canada-roads.mjs -> ca/r/) and the new trails for the 🔔 (scripts/build-new-trails.mjs ca -> ca/new-trails.json) and the ski resort runs, groomed nordic and snowmobile trails (scripts/build-canada-winter.mjs -> ca/w/).
on:
  schedule:
    - cron: "17 8 * * *"    # 08:17 UTC; Geofabrik's daily extracts are out by then
  workflow_dispatch:
    inputs:
      provinces:
        description: "Province ids to build (blank = all): ab bc mb nb nl ns nt nu on pe qc sk yt"
        required: false

permissions:
  contents: write   # push the canada-data branch

concurrency:
  group: canada-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PROVINCES: ${{ github.event.inputs.provinces || 'pe nl ns nb yt nt nu sk mb ab bc on qc' }}
      NODE_OPTIONS: --max-old-space-size=12000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download and filter each province
        run: |
          declare -A NAME=( [ab]=alberta [bc]=british-columbia [mb]=manitoba [nb]=new-brunswick [nl]=newfoundland-and-labrador
            [ns]=nova-scotia [nt]=northwest-territories [nu]=nunavut [on]=ontario [pe]=prince-edward-island [qc]=quebec
            [sk]=saskatchewan [yt]=yukon )
          echo '{"attributes":{"type":true,"id":true,"version":true,"timestamp":true},"linear_tags":true,"area_tags":false}' > /tmp/export.json
          mkdir -p /tmp/osm
          for p in $PROVINCES; do
            echo "::group::${NAME[$p]}"
            curl -sSfL --retry 3 -o /tmp/osm/p.pbf "https://download.geofabrik.de/north-america/canada/${NAME[$p]}-latest.osm.pbf"
            ls -lh /tmp/osm/p.pbf
            osmium tags-filter --overwrite -o /tmp/osm/f.pbf /tmp/osm/p.pbf \
              w/highway=path,bridleway,track,footway,cycleway r/route=mtb,bicycle,hiking,foot,horse,motorcycle,atv
            # Bike parks, pump tracks and MTB centres (scripts/build-bike-parks.mjs), with ski hills and lifts for lift-served ones.
            osmium tags-filter --overwrite -o /tmp/osm/b.pbf /tmp/osm/p.pbf \
              nwr/sport=bmx,mtb,cycling,mountain_biking,bicycle,pump_track,dirt_jumping,freeride \
              nwr/leisure=track,pitch,sports_centre,park,recreation_ground,bmx_track nwr/landuse=winter_sports w/aerialway nwr/pump_track
            # Trailheads, parking, water, toilets, repair stations and shelters (scripts/build-canada-access.mjs).
            osmium tags-filter --overwrite -o /tmp/osm/a.pbf /tmp/osm/p.pbf \
              nwr/highway=trailhead nwr/amenity=parking,drinking_water,toilets,bicycle_repair_station,bicycle_wash,shelter
            # Forest and dirt roads (scripts/build-canada-roads.mjs keeps the ones near MTB trails).
            osmium tags-filter --overwrite -o /tmp/osm/rd.pbf /tmp/osm/p.pbf \
              w/highway=track,unclassified,service,road w/disused:highway w/abandoned:highway
            # Ski resort runs, groomed nordic and snowmobile trails (scripts/build-canada-winter.mjs); relation members come along.
            osmium tags-filter --overwrite -o /tmp/osm/s.pbf /tmp/osm/p.pbf \
              w/piste:type w/snowmobile=yes,designated,permissive w/ski:nordic=yes,designated r/route=ski,piste,snowmobile r/piste:type
            rm /tmp/osm/p.pbf
            osmium export --overwrite -c /tmp/export.json -n --geometry-types=linestring -f geojsonseq -o /tmp/osm/s.geojsonseq /tmp/osm/s.pbf
            osmium cat --overwrite -t relation -f opl -o /tmp/osm/s.opl /tmp/osm/s.pbf
            node scripts/build-canada-winter.mjs ingest "$p" /tmp/osm/s.geojsonseq /tmp/osm/s.opl || echo "::warning::Winter trails failed for $p"
            osmium export --overwrite -c /tmp/export.json -f geojsonseq -o /tmp/osm/rd.geojsonseq /tmp/osm/rd.pbf
            osmium export --overwrite -a type,id -f geojsonseq -o /tmp/osm/a.geojsonseq /tmp/osm/a.pbf
            node scripts/build-canada-access.mjs ingest "$p" /tmp/osm/a.geojsonseq || echo "::warning::Trailheads failed for $p"
            osmium export --overwrite -a type,id -f geojsonseq -o /tmp/osm/b.geojsonseq /tmp/osm/b.pbf
            osmium export --overwrite -c /tmp/export.json -f geojsonseq -o /tmp/osm/w.geojsonseq /tmp/osm/f.pbf
            osmium cat --overwrite -t relation -f opl -o /tmp/osm/r.opl /tmp/osm/f.pbf
            node scripts/build-canada.mjs ingest "$p" /tmp/osm/w.geojsonseq /tmp/osm/r.opl
            node scripts/build-bike-parks.mjs ingest "$p" /tmp/osm/b.geojsonseq /tmp/osm/w.geojsonseq || echo "::warning::Bike parks failed for $p"
            node scripts/build-canada-roads.mjs ingest "$p" /tmp/osm/rd.geojsonseq || echo "::warning::Forest roads failed for $p"
            rm /tmp/osm/*
            echo "::endgroup::"
          done
      - name: Build the chunks
        run: node scripts/build-canada.mjs finish
      - name: Trailheads, parking, forest roads and winter trails across Canada
        run: |
          node scripts/build-canada-access.mjs finish || echo "::warning::Trailheads and parking failed"
          node scripts/build-canada-roads.mjs finish || echo "::warning::Forest roads failed"
          node scripts/build-canada-winter.mjs finish || echo "::warning::Winter trails failed"
      - name: New trails across Canada (for the 🔔 alerts)
        run: |
          # Last night's chunks and feed, to compare with (scripts/build-new-trails.mjs ca). The first night starts the feed.
          git fetch -q --depth=1 origin canada-data:refs/ca/last || echo "No canada-data branch yet"
          node scripts/build-new-trails.mjs ca || echo "::warning::New trails across Canada failed"
      - name: Build the bike parks list
        run: node scripts/build-bike-parks.mjs finish || echo "::warning::Bike parks list failed"
      - name: Replace the canada-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b canada-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ca
          git commit -q -m "Canada trail data"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:canada-data
