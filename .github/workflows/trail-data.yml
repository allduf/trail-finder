name: Nightly trail data

# Every 3 hours, collect the region's new trails and trail names from OpenStreetMap into data/,
# so the website loads them from GitHub instead of every visitor asking Overpass.
# Overpass is busy and the region (Vancouver to Calgary) has about 170 map squares, so each run does the
# squares built longest ago until its time is up; together the runs refresh every square every day or two.
# Trails that appeared since the last run go into data/new-trails.json, the app's 🔔 notifications.
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (10:23 UTC is around 3 am in Vancouver)
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write   # save the data files (site-data branch)
  pages: write      # ask GitHub Pages to publish them

concurrency:
  group: trail-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # build-data.mjs stops asking Overpass after 100 minutes, leaving time to save
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect trails and names
        run: node scripts/build-data.mjs
      - name: Add tonight's new trails to the notifications feed
        run: node scripts/build-new-trails.mjs
      - name: Save the new data
        if: github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Nightly trail data" 'data/trails-*.json' 'data/names-*.json' data/new-trails.json
      - name: Publish the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
