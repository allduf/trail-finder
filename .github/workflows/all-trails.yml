name: All trails data

# Every day, collect every MTB trail in the region (any age, with its shape) from OpenStreetMap into
# data/mtb-<zone>.json, so the website can draw them all coloured by difficulty.
on:
  schedule:
    - cron: "41 */6 * * *"   # every 6 hours: each run does the zones built longest ago for 25 minutes
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write   # save the data files (site-data branch)
  pages: write      # ask GitHub Pages to publish them

concurrency:
  group: all-trails
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # build-mtb.mjs stops asking Overpass after 25 minutes
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect all MTB trails
        run: node scripts/build-mtb.mjs
      - name: Split trails where they cross a road
        run: node scripts/build-road-splits.mjs   # data/road-splits.json, from the trail lists and data/roads-<zone>.json
      - name: Save the new data
        if: github.ref_name == 'main'
        run: bash scripts/site-data.sh save "All trails data" 'data/mtb-*.json' data/road-splits.json
      - name: Publish the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
