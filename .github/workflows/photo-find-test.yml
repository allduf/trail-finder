name: Photo find accuracy

# Runs the pictures riders confirmed ("Yes, that's it") through "Which trail is this?" in a real browser and reports how
# often the right trail comes first or in the top 3 (issue "Photo find accuracy"). See scripts/photo-find-test.mjs.
# Weekly, after a change to photo find reaches main, on pull requests that change it, and with the "Run workflow" button.
# Each picture uses one AI look, one online check and one reverse search from the function's daily limits.
# Needs the repository secret SUPABASE_SECRET_KEY (the same one the loam alerts use).
on:
  schedule:
    - cron: "23 15 * * 1"    # Mondays 8:23 am Pacific (summer time)
  push:
    branches: [main]
    paths: ["photo-find.js", "supabase/functions/which-trail/**", "scripts/photo-find-test.mjs"]
  pull_request:
    paths: ["photo-find.js", "supabase/functions/which-trail/**", "scripts/photo-find-test.mjs"]
  workflow_dispatch:
    inputs:
      cases:
        description: "How many confirmed pictures to test"
        required: false
        default: "10"

permissions:
  contents: read
  issues: write   # the "Photo find accuracy" issue

concurrency:
  group: photo-find-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Test photo find
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CASES: ${{ github.event.inputs.cases || '10' }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: allduf
          LABEL: ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || '' }}
        run: node scripts/photo-find-test.mjs
