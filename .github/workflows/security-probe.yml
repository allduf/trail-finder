name: Security probe

# What a stranger can see in the live database, with only the public key every visitor has (scripts/security-probe.mjs).
# Fails (and GitHub emails alex) if anything private answers. Weekly, and on every change to the database files.
on:
  schedule:
    - cron: "23 14 * * 1"   # Mondays 14:23 UTC, early morning in BC
  pull_request:
    paths: ["supabase/**", "account.js", "scripts/security-probe.mjs", ".github/workflows/security-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ask the database as a stranger
        run: node scripts/security-probe.mjs
