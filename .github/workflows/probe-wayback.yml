name: probe-wayback
on:
  push:
    branches: [claude/photo-time-slider-v4exnd]
    paths: [.github/workflows/probe-wayback.yml, photo-slider.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          mkdir -p probe-shots
          cat > p.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [name, lat, lon, z, w, h] of [["squamish", 49.745, -123.115, 16, 1280, 800], ["revelstoke", 51.0, -118.17, 16, 1280, 800], ["kamloops-phone", 50.69, -120.14, 16, 390, 800]]) {
            const p = await b.newPage({ viewport: { width: w, height: h } });
            p.on("pageerror", (e) => console.log(name, "pageerror", e.message));
            const t0 = Date.now();
            await p.goto("http://localhost:8765/index.html");
            await p.waitForFunction(() => window.tfLeaflet && window.tfPhotoSlider);
            await p.evaluate(([lat, lon, z]) => tfLeaflet.setView([lat, lon], z, { animate: false }), [lat, lon, z]);
            await p.waitForTimeout(1500);
            await p.evaluate(() => { document.getElementById("firstTip").hidden = true; tfPhotoSlider.setOn(true); });
            const t1 = Date.now();
            await p.waitForFunction(() => /photos? (of|has)|Only one|Couldn't/.test(document.getElementById("psNote").textContent), null, { timeout: 60000 }).catch(() => {});
            console.log(name, "list in", Date.now() - t1, "ms:", await p.evaluate(() => [...document.querySelectorAll("#psOld option")].map((o) => o.textContent).join(", ") + " | " + document.getElementById("psNote").textContent));
            await p.waitForTimeout(6000);
            await p.screenshot({ path: `probe-shots/${name}-50.png` });
            await p.evaluate(() => { const r = tfLeaflet.getContainer().getBoundingClientRect(); });
            const hb = await p.locator(".ps-handle").boundingBox();
            await p.mouse.move(hb.x + 22, hb.y + hb.height / 2 + 60); await p.mouse.down(); await p.mouse.move(hb.x + 22 - w * 0.3, hb.y + hb.height / 2 + 60, { steps: 6 }); await p.mouse.up();
            await p.waitForTimeout(1500);
            await p.screenshot({ path: `probe-shots/${name}-left.png` });
            await p.close();
          }
          await b.close();
          JS
          node p.mjs
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add probe-shots && git commit -qm "Probe screenshots" && git push -q
