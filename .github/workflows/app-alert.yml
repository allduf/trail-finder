name: Crash and error alert

# Every 15 minutes: a new crash restart, or a kind of error not seen in the 14 days before, from a real phone (test and
# review devices left out, as on usage.html) gets a comment on the GitHub issue "New crash or error alerts" that
# mentions alex, so GitHub emails alex and notifies the GitHub phone app within minutes (alex 2026-11-27, after crashes
# were only found by looking at the usage page). See scripts/app-alert.mjs. On a pull request that changes it: a dry
# run over the last 3 days, no comment.
# Needs the repository secret SUPABASE_SECRET_KEY (the same one the daily app errors use).
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  pull_request:
    paths: ["scripts/app-alert.mjs", "scripts/test-devices.mjs", ".github/workflows/app-alert.yml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the "New crash or error alerts" issue

concurrency:
  group: app-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for new crashes and errors
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: allduf
          DRY: ${{ github.event_name == 'pull_request' && '1' || '' }}
          HOURS: ${{ github.event_name == 'pull_request' && '72' || '' }}
        run: node scripts/app-alert.mjs
