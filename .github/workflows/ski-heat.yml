name: Weekly ski heatmap

# Once a week, count the winter (December to April) OpenStreetMap public GPS traces per ~33 m cell and save
# them in data/ski-heat.json for the "Ski heatmap" in the site's Skiing mode.
# Squares are done in rotation (about 1500 trace pages per run), so the whole region refreshes over a few weeks.
# On a pull request that changes the script it only does a short test run, without saving anything.
on:
  schedule:
    - cron: "17 12 * * 3"   # Wednesdays, 12:17 UTC (early morning in Vancouver)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  pull_request:
    paths:
      - scripts/build-ski-heat.mjs
      - .github/workflows/ski-heat.yml

permissions:
  contents: write   # commit the data file
  pages: write      # ask GitHub Pages to publish it

concurrency:
  group: ski-heat-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  heat:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count winter GPS traces
        env:
          PAGE_BUDGET: ${{ github.event_name == 'pull_request' && '40' || '1500' }}
        run: node scripts/build-ski-heat.mjs
      - name: File size
        run: ls -l data/ski-heat.json || true
      - name: Save the new data
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Weekly ski heatmap" data/ski-heat.json
      - name: Publish the website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
