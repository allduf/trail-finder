name: Daily ski heatmap

# Every day, count the winter OpenStreetMap public GPS traces per ~33 m cell in the backcountry squares across
# Canada and save them in data/ski-heat.json for the "Ski heatmap" in the site's Skiing mode.
# Squares are done in rotation (up to 1500 trace pages or 200 minutes a run, saved as it goes), so all ~650
# squares are done over about a week, then refresh in turn.
# On a pull request that changes the script it only does a short test run, without saving anything.
on:
  schedule:
    - cron: "17 12 * * *"   # every day, 12:17 UTC (early morning in Vancouver)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  pull_request:
    paths:
      - scripts/build-ski-heat.mjs
      - .github/workflows/ski-heat.yml

permissions:
  contents: write   # commit the data file
  pages: write      # ask GitHub Pages to publish it

concurrency:
  group: ski-heat-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  heat:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Count winter GPS traces
        env:
          PAGE_BUDGET: ${{ github.event_name == 'pull_request' && '40' || '1500' }}
          MINUTES: ${{ github.event_name == 'pull_request' && '20' || '200' }}
        run: node scripts/build-ski-heat.mjs
      - name: File size
        if: always()
        run: ls -l data/ski-heat.json || true
      - name: Save the new data
        if: always() && github.event_name != 'pull_request' && github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Daily ski heatmap" data/ski-heat.json
      - name: Publish the website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
