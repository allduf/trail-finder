name: Wildfires data

# Every 3 hours, collect current BC Wildfire Service fires and fire perimeters near the region into data/fires.json,
# and the rest of Canada's (CWFIS national fires and satellite fire areas, Alberta Wildfire fires, fire control orders
# and evacuations) into data/fires-ca.json, shown with the "Wildfires" button on the website.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: wildfires
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect wildfires
        run: ONLY=fires node scripts/build-roads.mjs
      - name: Save the new data
        if: github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Wildfires data" data/fires.json data/fires-ca.json
      - name: Publish the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
