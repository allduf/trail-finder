name: Local trail data finder

# Every month, look for towns' and regional districts' own trail layers with difficulty ratings around each zone, and tell
# alex about new ones on the issue "Local trail data finder" (scripts/find-sources.mjs). Nothing goes on the map until
# someone checks the licence and adds it to scripts/build-official.mjs and scripts/build-ratings.mjs.
on:
  schedule:
    - cron: "23 14 3 * *"   # the 3rd of every month, 14:23 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  issues: write   # open the issue and add comments

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look for local trail data
        env:
          OWNER: allduf
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/find-sources.mjs
