name: Bike park map watch

# Reads each bike park's official trail map or trail list and comments on the issue
# "Bike park maps changed" (mentioning alex, so GitHub emails them) when one changes.
# Every 2 weeks in the riding season, monthly the rest of the year. See scripts/watch-park-maps.mjs.
on:
  schedule:
    - cron: "23 15 1,15 5-10 *"        # 1st and 15th, May to October
    - cron: "23 15 1 1-4,11,12 *"      # 1st of the month, November to April
  workflow_dispatch:                    # "Run workflow" button on the Actions tab

permissions:
  issues: write   # open the issue and add comments

concurrency:
  group: park-map-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read the maps
        env:
          OWNER: allduf
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/watch-park-maps.mjs
