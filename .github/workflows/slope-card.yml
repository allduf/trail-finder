name: Slope card

# The native 3D slope card (This spot, after a slope is tapped with the avalanche shading on) shows every row the page
# sends, with no row squeezed to nothing and no line cut short, on the iPhone and Android simulators
# (scripts/slope-card/check.mjs; 2026-11-26: the iPhone card had lost "Striped because" and most other rows; with the
# old height rule this check lists exactly those rows).
on:
  pull_request:
    paths:
      - "ios-app/plugins/TrailMap/ios/Sources/TrailMap/NativeAvalanche.swift"
      - "android-app/plugins/TrailMap/android/src/main/java/com/allduf/trailmap/NativeAvalanche.java"
      - "native-avalanche.js"
      - "scripts/slope-card/**"
      - ".github/workflows/slope-card.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Gradle tries a failed download again 6 times, waiting 2 s then longer each time (default 3 tries from 0.1 s), so a
  # short Maven Central limit (429) or server error passes instead of failing the build.
  GRADLE_RETRY: -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000

concurrency:
  group: slope-card-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slot:
    # At most 2 heavy test runs at once (scripts/ci/heavy-slot.sh, alex 2026-11-27): the jobs below wait here.
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - name: Wait for a free heavy test slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/heavy-slot.sh

  iphone:
    needs: slot
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90   # v1.7.0, pinned to one exact version
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test build for the simulator (opens this runner's site)
        working-directory: ios-app
        run: |
          npm ci
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json"));
            c.server.url = "http://localhost:8080/"; c.server.cleartext = true; c.server.allowNavigation.push("localhost");
            c.ios.limitsNavigationsToAppBoundDomains = false;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));'
          npx cap sync ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :WKAppBoundDomains: string localhost" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" $P || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $P || true
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=99999 build | tail -30   # newer than any TestFlight build: no "New version" card
      - name: iPhone simulator
        run: |
          DEV=$(xcrun simctl list devices available -j | node -e '
            const d = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat().filter((x) => /^iPhone/.test(x.name));
            const p = d.find((x) => /Pro Max/.test(x.name)) || d.find((x) => /Plus/.test(x.name)) || d[0]; console.log(p.udid); console.error(p.name);')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install booted "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl privacy booted grant location-always com.allduf.trailfinder || true
          xcrun simctl location booted set 50.11,-122.95 || true
          xcrun simctl status_bar booted override --time 9:41 || true
      - name: Slope card check
        run: PLATFORM=ios node scripts/slope-card/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slope-card-iphone
          path: out/slope-card/
          if-no-files-found: ignore

  android:
    needs: slot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test build (opens this runner's site through adb reverse)
        working-directory: android-app
        run: |
          npm ci
          npm uninstall --no-save @capacitor/push-notifications
          node -e '
            const fs = require("fs"), c = JSON.parse(fs.readFileSync("capacitor.config.json"));
            c.server.url = "http://localhost:8080/"; c.server.cleartext = true; c.server.allowNavigation.push("localhost");
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));'
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon -q $GRADLE_RETRY
      - name: Turn on the simulator's speed-up (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Slope card check on an Android 14 simulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d   # v2.38.0, pinned to one exact version
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/slope-card/android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slope-card-android
          path: out/slope-card/
          if-no-files-found: ignore
