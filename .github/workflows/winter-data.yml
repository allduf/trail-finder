name: Winter data

# For the site's "Winter" mode, every night:
#  - backcountry ski routes, snowmobile trails and huts (OpenStreetMap + BC Recreation Sites and Trails) -> data/ski.json
#  - the backcountry routes and huts in the rest of Canada (OpenStreetMap, camptocamp, BC, Sépaq, Parks Canada),
#    one file per map square -> data/ski-canada/
#  - each backcountry route's avalanche terrain class estimate (scripts/build-ski-terrain.mjs) -> data/ski-terrain.json
# The avalanche forecasts, riders' reports, grooming reports and snow stations (every 2 hours) are the "Avalanche and
# snow data" job since 2026-11-27 (avalanche-data.yml): GitHub skipped most of this workflow's 2-hourly schedule, so
# that one keeps itself going. Each job saves only its own files.
# On a pull request that changes the script it only does a test run of every part (the avalanche and snow ones too),
# without saving anything.
on:
  schedule:
    - cron: "41 10 * * *"    # ski routes, 10:41 UTC (early morning in BC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  pull_request:
    paths:
      - scripts/build-winter.mjs
      - scripts/build-snow-stations.mjs
      - scripts/build-ski-terrain.mjs
      - ski-terrain.js
      - .github/workflows/winter-data.yml
      - data/snowmobile-clubs.json

permissions:
  contents: write   # save the data files (site-data branch)
  pages: write      # ask GitHub Pages to publish them

concurrency:
  group: winter-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect winter data
        env:
          ONLY: ${{ github.event_name != 'pull_request' && 'ski,canada' || '' }}   # a pull request tests every part
          PROBE: ${{ github.event_name == 'pull_request' && '1' || '' }}
          CANADA_OSM_MIN: ${{ github.event_name == 'pull_request' && '8' || '30' }}   # Canada-wide OpenStreetMap: minutes a run (the rest keep their last data)
        run: node scripts/build-winter.mjs
      - name: Avalanche terrain class of each ski route (with the ski routes; a failure keeps the last file)
        env:
          LIMIT_MIN: ${{ github.event_name == 'pull_request' && '5' || '25' }}
        run: node scripts/build-ski-terrain.mjs || echo "::warning::Ski terrain failed; keeping the last file"
      - name: Snow stations (a pull request's test only; avalanche-data.yml makes them)
        if: github.event_name == 'pull_request'
        run: node scripts/build-snow-stations.mjs || echo "::warning::Snow stations failed; keeping the last file"
      - name: File sizes
        run: du -sh data/ski-canada || true; ls -l data/ski.json data/ski-terrain.json data/avalanche.json data/avalanche-reports.json data/grooming.json data/snow-stations.json || true
      - name: Save the new data
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        # Only this job's files: a copy of the avalanche ones from the start of this run would undo a newer save of theirs.
        run: bash scripts/site-data.sh save "Winter data" data/ski.json data/ski-canada data/ski-terrain.json
      - name: Publish the website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
