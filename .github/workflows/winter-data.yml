name: Winter data

# For the site's "Winter" mode:
#  - every 2 hours, Avalanche Canada's current avalanche forecasts for the region -> data/avalanche.json, and the
#    snowmobile clubs' grooming reports (data/snowmobile-clubs.json) -> data/grooming.json
#    and the last 2 weeks of Avalanche Canada Mountain Information Network reports -> data/avalanche-reports.json
#    and the BC snow pillow stations' snow depth, new snow and temperature -> data/snow-stations.json
#  - every night, backcountry ski routes, snowmobile trails and huts (OpenStreetMap + BC Recreation Sites and Trails) -> data/ski.json
#    and the backcountry routes and huts in the rest of Canada (OpenStreetMap, camptocamp, BC, Sépaq, Parks Canada),
#    one file per map square -> data/ski-canada/
#    and each backcountry route's avalanche terrain class estimate (scripts/build-ski-terrain.mjs) -> data/ski-terrain.json
# On a pull request that changes the script it only does a test run, without saving anything.
on:
  schedule:
    - cron: "23 */2 * * *"   # avalanche forecasts
    - cron: "41 10 * * *"    # ski routes, 10:41 UTC (early morning in BC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab: both
  pull_request:
    paths:
      - scripts/build-winter.mjs
      - scripts/build-snow-stations.mjs
      - scripts/build-ski-terrain.mjs
      - ski-terrain.js
      - .github/workflows/winter-data.yml
      - data/snowmobile-clubs.json

permissions:
  contents: write   # save the data files (site-data branch)
  pages: write      # ask GitHub Pages to publish them

concurrency:
  group: winter-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get the data files (from the site-data branch, see scripts/site-data.sh)
        run: bash scripts/site-data.sh get
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect winter data
        env:
          ONLY: ${{ github.event.schedule == '23 */2 * * *' && 'avy,groom' || (github.event.schedule == '41 10 * * *' && 'ski,canada' || '') }}
          PROBE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node scripts/build-winter.mjs
      - name: Avalanche terrain class of each ski route (with the ski routes; a failure keeps the last file)
        if: github.event.schedule != '23 */2 * * *'
        env:
          LIMIT_MIN: ${{ github.event_name == 'pull_request' && '5' || '25' }}
        run: node scripts/build-ski-terrain.mjs || echo "::warning::Ski terrain failed; keeping the last file"
      - name: Snow stations (with the avalanche forecasts; a failure keeps the last file)
        if: github.event.schedule != '41 10 * * *'
        run: node scripts/build-snow-stations.mjs || echo "::warning::Snow stations failed; keeping the last file"
      - name: File sizes
        run: du -sh data/ski-canada || true; ls -l data/ski.json data/ski-terrain.json data/avalanche.json data/avalanche-reports.json data/grooming.json data/snow-stations.json || true
      - name: Save the new data
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        run: bash scripts/site-data.sh save "Winter data" data/ski.json data/ski-canada data/ski-terrain.json data/avalanche.json data/avalanche-reports.json data/grooming.json data/snow-stations.json
      - name: Publish the website
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "Pages will publish on its own."
